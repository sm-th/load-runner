[project]
name = "load-runner"
version = "0.1.0"
description = "Mechanical runners, AI agents, and people in one thread: a message-bus loop for CI, monitoring, and training runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andy Smith", email = "me@andysmith.ai" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["agents", "message-bus", "buzz", "zulip", "human-in-the-loop", "runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/sm-th/load-runner"
Article = "https://andysmith.ai/2026/Oct/2/communication-between-runners-and-agents/"

[project.scripts]
load-runner = "load_runner.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
